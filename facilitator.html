<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Facilitator · malariasimulation constitution workshop</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/app.css">
    <script>
      // Apply ?theme=light|dark, or a saved light/dark choice, before first paint.
      try {
        var theme = new URLSearchParams(location.search).get('theme') || JSON.parse(localStorage.getItem('cw:facilitator:theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <script type="module" src="js/facilitator.js"></script>
  </head>
  <body>
    <div id="app" class="app"><p class="boot">Loading the facilitator view…</p></div>
    <noscript><p class="boot">This workshop tool needs JavaScript switched on.</p></noscript>
  </body>
</html>
